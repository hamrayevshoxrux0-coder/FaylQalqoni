name: APK qurish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Kerakli SDK paketlarini o'rnatish
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle'ga ishga tushirish ruxsati berish
        run: chmod +x ./gradlew

      - name: Debug APK qurish
        run: ./gradlew assembleDebug --no-daemon

      - name: Tayyor APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: FaylQalqoni-debug-apk
          path: app/build/outputs/apk/debug/*.apk
